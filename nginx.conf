# Example Nginx config for Node.js file server
# - SSL termination
# - Static file serving
# - Reverse proxy to Node.js cluster
# - Load balancing (if multiple Node.js instances)

server {
    listen 80;
    server_name 172.30.10.210;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 172.30.10.210;

    ssl_certificate     /etc/ssl/certs/172.30.10.210.crt;
    ssl_certificate_key /etc/ssl/private/172.30.10.210.key;

    # Static files (served directly by Nginx)
    location /files/ {
        alias /home/admin/Desktop/fileserver/storage/;
        autoindex on;
    }

    # Proxy uploads and API to Node.js
    location /upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2G;
    }

    # (Optional) Proxy other API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
